# electron-builder 打包配置
# 用法：npm run electron:build

appId: com.opc.agent
productName: OPC Agent

directories:
  output: release

# 只打运行时真正需要的东西。
#
# ⚠️ 关键前提：package.json 里 `dependencies` **只留服务端运行时真正 require 的三个包**
# （express / @tencent-ai/agent-sdk / uuid）。React、tdesign、d3、codemirror 这些
# 全部在 devDependencies —— 它们已经被 Vite 打进 dist/assets/index-*.js 了，
# 运行时根本不需要 node_modules 里的副本。
#
# 为什么必须这么拆：electron-builder 会把 `dependencies` 的生产依赖树交给
# appFileCopier.computeNodeModuleFileSets()，那个函数对依赖图做**递归目录遍历**，
# 而它拿到的其实是一棵从 DAG 展开出来的树（同一个包在多个位置各存一份子树）。
# 依赖树一大，遍历量就呈组合式爆炸 —— 实测把前端库全算进去时，
# 打包会卡在这一步 9 分钟以上毫无进展。拆干净之后这一步是秒级。
files:
  - dist/**
  - dist-electron/**
  - node_modules/**
  - package.json
  # MIT / Apache-2.0 / BSD 都要求「分发副本时保留版权与许可声明」。
  # 下面的 `!**/{...,LICENSE,LICENSE.md}` 为减小包体排除了各依赖的 LICENSE，
  # 这份清单（274 个组件的许可类型 + 版权行）就是把声明补回来的载体 ——
  # 必须随包，否则安装包形态下署名义务落空。对应闸门：verify:license-bundle。
  - THIRD-PARTY-LICENSES.txt
  # 注意：窗口图标不在这里列。build/ 是 buildResources 目录，electron-builder
  # 不会把它的内容复制进 app.asar —— 列了也无效。窗口图标由 build-electron.mjs
  # 拷进 dist-electron/icon.png，随 dist-electron/** 一起进包。
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/*.tsbuildinfo'
  - '!**/{CHANGELOG.md,README.md,readme.md,LICENSE,LICENSE.md}'
  - '!**/{.github,.vscode,__tests__,test,tests,example,examples,docs}/**'
  # ── 瘦身批次 1（2026-11-19，S6 报告路线①）：排除非 win32-x64 平台二进制 ──
  # 本安装包只面向 Windows x64；以下目录是 macOS/Linux/arm64 的副本，
  # 打进包里纯属浪费（实测 node-pty arm64 28MB + ripgrep 四平台 + genie-trash/
  # sandbox 的 mac/linux 目录，合计约 70-90MB）。
  # 只删「非目标平台」的副本——win32-x64 一个都不动（冒烟闸门会验证）。
  - '!node_modules/node-pty/prebuilds/darwin-arm64/**'
  - '!node_modules/node-pty/prebuilds/darwin-x64/**'
  - '!node_modules/node-pty/prebuilds/win32-arm64/**'
  - '!node_modules/@tencent-ai/agent-sdk/cli/vendor/ripgrep/{arm64-darwin,arm64-linux,x64-darwin,x64-linux}/**'
  - '!node_modules/@tencent-ai/agent-sdk/cli/vendor/genie-trash/{darwin-arm64,darwin-x64,linux-arm64,linux-x64}/**'
  - '!node_modules/@tencent-ai/agent-sdk/cli/vendor/sandbox-center-runtime-kit/**/macos*/**'
  - '!node_modules/@tencent-ai/agent-sdk/cli/vendor/sandbox-center-runtime-kit/**/darwin*/**'
  - '!node_modules/@tencent-ai/agent-sdk/cli/vendor/sandbox-center-runtime-kit/**/linux*/**'
  # ── 瘦身批次 2（2026-11-19）：Codex / Claude 运行组件改为按需下载 ──
  # 两个平台包各带一个几百 MB 的可执行文件（codex.exe 354.5MB + 资源 ≈ 479.5MB、
  # claude.exe 319.9MB），是安装包体积的绝对大头。它们不随包分发，用户第一次
  # 使用对应 Agent 时由 `server/agents/vendorComponents.ts` 从 npm 镜像按
  # package-lock.json 记录的 sha512 校验后下载到 `<dataDir>/vendor/<id>/`。
  #
  # ⚠️ 不要顺手删这两行下方的注释去「恢复内置」——那会把 setup 重新推回 385MB。
  # 冒烟闸门 verify:package 会校验包里不含这两个目录，verify:a232 会校验
  # 这里的排除规则仍然存在。
  - '!node_modules/@openai/codex-win32-x64/**'
  - '!node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/**'
  # ── 合规改造（2026-11-23）：Claude SDK 本体改「用户自装」────────────
  # @anthropic-ai/claude-agent-sdk 本体约 5MB，许可是「All rights reserved」，
  # 随包分发属于再分发专有副本。改为排除：用户自行 npm i -g 安装，应用只在
  # 运行时用 server/agents/claudeSdkLocator.ts 定位并 import 那一份，全程不
  # 碰副本、不代下载 —— 真正脱离分发链（对应 THIRD-PARTY.md 保守选择 B）。
  # ⚠️ 排除本体后，adapter 的 probe/loadSdk 必须同步（已改），否则会「假绿」。
  # 闸门 verify:claude-sdk-bundle 钉住此处 + probe 判据 + 引导文案。
  - '!node_modules/@anthropic-ai/claude-agent-sdk/**'
  # 2026-10-31：把 @tencent-ai/agent-sdk 内嵌的 CLI（cli/）**打回安装包**。
  #
  # 此前（2026-10-30）因为 cli/package.json 写 "SEE LICENSE IN README.md"
  # 而 README 未随包发布，曾整目录排除，改要求用户自行安装 codebuddy CLI。
  # 实测后果是：WorkBuddy 在打包版里恒为「未安装」（本机 PATH / 常见目录都没有
  # codebuddy），而开发态因为 node_modules 里有这份 cli/ 所以正常 —— 典型的
  # 「dev 能用、装完不能用」。已确认随 SDK 一起分发（+约 107MB）。
  #
  # 运行时由 bootstrap.cjs 把 CODEBUDDY_CODE_PATH 指到 app.asar.unpacked 下的
  # 真实路径（见下面 asarUnpack），SDK 的 resolveCLIPath() 第一顺位就用它。

# ── Electron 运行时来源 ────────────────────────────────────────────────────
# 默认流程是：下载 electron zip → 解压到 <out>/win-unpacked.tmp
#            → fs.rm(<out>/win-unpacked) → fs.rename(win-unpacked.tmp, win-unpacked)
# （见 app-builder-lib/out/util/electronGet.js 的 extractArchive()）。
#
# 这台机器上最后那步目录改名会稳定失败，因为 .tmp 里的 default_app.asar 会被
# 文件系统过滤驱动咬住（实测：open r+ 成功，但 rename / unlink 一律 EBUSY）。
# 更麻烦的是它连带让 .tmp 整棵树删不掉，污染下一次构建。
#
# 指向「已解压的 Electron 目录」可以绕开整条 zip 分支 —— ElectronFramework.js
# 会改走 emptyDir() + copyDir()，既不创建 .tmp，也不做任何目录改名。
# node_modules/electron/dist 就是 npm 包解压好的运行时，内容与官方 zip 完全一致
# （实测 368 MB / 55 个 locale / default_app.asar 110862 B 逐一对应）。
electronDist: node_modules/electron/dist

asar: true

asarUnpack:
  # node-pty（PTY 终端）是原生模块，`.node` 留在 asar 里根本加载不了；
  # 它还要 spawn `winpty-agent.exe`、加载 `conpty.dll` / `OpenConsole.exe`
  # —— 全都要能当真实文件访问。
  #
  # 用的是包里自带的 `prebuilds/win32-x64/*.node`（N-API，ABI 稳定，Electron
  # 直接能加载，已实测），所以**不需要**原生重建，nodeGypRebuild 保持 false。
  - node_modules/node-pty/**
  # WorkBuddy 的 codebuddy CLI 必须在 asar 外：它自己会 spawn vendor 下的
  # ripgrep / shim 等真实可执行文件，asar 内的路径 spawn 不了；而且
  # bootstrap.cjs 需要给它一个**真实存在的绝对路径**（CODEBUDDY_CODE_PATH
  # 只对 existsSync 通过的真实文件生效）。
  - node_modules/@tencent-ai/agent-sdk/cli/**
  # A176：kb.search 的 stdio MCP server 要以真实文件被 spawn（Claude/腾讯 SDK、
  # Codex 之外的三条通道都会拉起它）。asar 内的 .cjs 在 ELECTRON_RUN_AS_NODE
  # 子进程里读得到但没有真实路径可执行，放到 asar.unpacked 最稳。
  - dist-electron/kb-mcp.cjs
  # A231：SDK 登录类子进程的设置源 shim，同 kb-mcp 的处置理由 —— 它由
  # executable/executableArgs 当脚本 spawn（node shim.cjs <cliJs> ...），
  # asar 内的路径没有真实文件可执行，必须放行到 unpacked。
  - dist-electron/sdk-settings-shim.cjs
  # M01：harness 进程壳**不进** asarUnpack —— 与 kb-mcp 相反。实测
  # （2026-11-20）：ELECTRON_RUN_AS_NODE 子进程从 asar.unpacked require
  # 裸依赖（express）会 MODULE_NOT_FOUND（依赖在 app.asar/node_modules，
  # 只有从 asar 内启动才沿 asar 解析）。入口解析见
  # electron/harness-manager.ts resolveHarnessEntry（asar 优先）。

# 本项目唯一的原生模块是 node-pty，而它走 N-API 预编译件（见上），
# 所以保持关掉重建：开了只会让 @electron/rebuild 在本机撞上 Spectre 库缺失
# （node-pty 的 binding.gyp 要求它，见 patches/node-pty+1.1.0.patch）。
#
# ⚠️ 2026-10-23 实测修正：**`nodeGypRebuild: false` 根本拦不住重建**。
# node-pty 一进 `dependencies`，electron-builder 就走 `npmRebuild`（默认 true）
# → `@electron/rebuild` → node-gyp，然后撞 MSB8040：
#   error MSB8040: 此项目需要缓解了 Spectre 漏洞的库
#   [.../node_modules/node-pty/build/deps/winpty/src/winpty-agent.vcxproj]
#   [.../node_modules/node-pty/build/deps/winpty/src/winpty.vcxproj]
# 注意报错来自 **winpty 自己的 vcxproj**，不是 node-pty 的 binding.gyp ——
# 也就是说 `patches/node-pty+1.1.0.patch` 单独并不足以让重建通过（它只补了
# binding.gyp 那一处 SpectreMitigation）。真正把重建挡掉的是下面这一行。
#
# 三行一起读：`npmRebuild: false` 是总闸；`nodeGypRebuild: false` 是 node-gyp
# 自己的开关（万一日后有人手动跑 electron-builder node-gyp-rebuild）；
# `buildDependenciesFromSource: false` 是不从源码编依赖。
# 预编译件走 N-API，Electron 44 直接加载（实测 34/34 冒烟证明过），
# 所以这三行关掉的东西一样都不需要。
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

win:
  # 应用图标（多尺寸 .ico，由 scripts/make-icons.mjs 从 build/logo-source.png 栅格化生成）。
  #
  # 这一处同时决定了五件事，所以必须配：
  #   • exe 文件本身的图标（资源管理器里看到的）
  #   • 安装包 / 便携版的图标
  #   • 桌面快捷方式、开始菜单快捷方式
  #   • 任务栏固定项
  #   • Alt+Tab 切换器
  # 不配的话 electron-builder 会用 Electron 默认的原子图标。
  # 它虽然也会自动找 build/icon.ico，但显式写出来，换路径时不会静默失效。
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # ⚠️ artifactName **不能**写在 win 层：nsis 和 portable 的产物都是 .exe，
  # 共用同一个名字会让后打的静默覆盖先打的（实测 portable 覆盖掉 nsis 安装器，
  # 输出目录里只剩一个 exe，看不出少了一个）。两个目标各自命名，见下面两处。
  # artifactName 只用于其他目标兜底。
  artifactName: ${productName}-${version}-${arch}.${ext}

# ⚠️ 必须显式写 null。
# 不写的话，electron-builder 会去看环境变量：只要环境里有 GITHUB_TOKEN / GH_TOKEN，
# 它就把 provider 当成 github 去解析发布配置；而本项目**不是 git 仓库**
# （无 .git/config，拿不到 repository 信息），getResolvedPublishConfig() 返回 null，
# 但 PublishManager 会把这个 null **原样放进数组**，随后 updateInfoBuilder 读
# `publishConfiguration.provider` → TypeError: Cannot read properties of null。
# 表现是「exe 已经打出来了，但进程退出码 1」，很容易误判成打包成功。
# 写 null 即「不发布」，从源头跳过整条 updateInfo 生成链，不受宿主环境变量影响。
publish: null

nsis:
  # 与 portable 区分开，避免同名覆盖
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OPC Agent
  # 卸载时保留 userData（会话数据库），避免用户聊天记录被顺手删掉
  deleteAppDataOnUninstall: false

portable:
  # 与 nsis 区分开，避免同名覆盖
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
