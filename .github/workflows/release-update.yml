name: 发布更新资产

# 打 tag `vX.Y.Z` 时构建三件套并挂到同一个 Release：
#   · app-<version>.asar               —— 代码层替换用
#   · OPC-Agent-<version>-x64-full.zip —— 运行时版本不一致时的完整包
#   · latest.json                      —— 已签名的更新清单
#
# 客户端固定读 `/releases/latest/download/latest.json`，因此这个 Release
# 必须是「最新」的 —— 打 tag 前确认它确实要比线上版本新。
#
# 签名私钥只放仓库 Secrets（OPC_UPDATE_PRIVATE_KEY，base64 PKCS#8）。
# 私钥一旦泄露，任何人都能签出一份能过验签的清单：轮换时同时更新
# electron/updater/config.ts 里的公钥并重新发版。
#
# 本地复现同一产物：
#   npm run build && npm run build:electron && node scripts/build-installer.mjs --dir
#   npx tsx scripts/build-update.ts --version 1.1.0 --notes-file release-notes.md --key .tmp/update-signing-key.json
# CI 与本地都走 scripts/build-update.ts，清单字段与签名正文由 shared/update-manifest.ts 统一。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: '发布渠道（stable / beta）'
        required: false
        default: 'stable'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布（windows-latest）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 这里不能 --ignore-scripts：打包要用真的 Electron 二进制，
      # node-pty 也需要在 runner 上编译原生模块。
      - name: 安装依赖
        run: npm ci

      - name: 更新链路闸门
        run: npm run verify:a171-update

      - name: 解析版本号
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $pkgVersion = node -p "require('./package.json').version"
          if ($ref -like 'v*') {
            $version = $ref.Substring(1)
            # tag 与 package.json 必须一致：electron-builder 打出的 asar 里
            # app.getVersion() 读的是 package.json，两者不一致会让客户端
            # 永远认为「有新版本」并反复提示。
            if ($version -ne $pkgVersion) {
              Write-Error "tag v$version 与 package.json 的 $pkgVersion 不一致，请先对齐版本号"
              exit 1
            }
          } else {
            $version = $pkgVersion
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+') {
            Write-Error "无法从 $ref 解析出版本号"
            exit 1
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "发布版本：v$version"

      - name: 构建渲染层与主进程
        run: |
          npm run build
          npm run build:electron

      # 打包前置自检：electron-builder 在 CI 上失败时只会甩一句
      # "Process completed with exit code 1"，看不出到底缺什么。这里先把
      # 三个版本号和 electron 运行时目录打出来：electron 版本一旦是 `^` 范围
      # 而又没装进 node_modules，electron-builder 会在配置加载后立刻失败。
      #
      # 自证背景：v1.0.1 那次（run 41485994197）第 8 步 3 秒就 exit 1，而
      # Actions 的 job 日志需要鉴权，匿名 API 只能拿到 annotation 里的一句
      # "Process completed with exit code 1"，根因无从确认。所以这里把
      # electron 运行时缺失时改成**显式补装**（不再依赖 postinstall 的隐式行为），
      # 并把打包输出落盘上传，下一次失败能自证。
      - name: 打包前置自检
        shell: pwsh
        run: |
          Write-Host '::group::环境版本'
          "node $(node -v) / npm $(npm -v)"
          "electron $(node -p "require('electron/package.json').version")"
          "electron-builder $(node -p "require('electron-builder/package.json').version")"
          Write-Host '::endgroup::'

          if (-not (Test-Path 'node_modules/electron/dist/electron.exe')) {
            Write-Host '::group::electron 运行时缺失，显式补装'
            node node_modules/electron/install.js
            Write-Host '::endgroup::'
          }
          if (-not (Test-Path 'node_modules/electron/dist/electron.exe')) {
            Write-Error 'electron 运行时仍然缺失：install.js 没能落下 dist/electron.exe'
            exit 1
          }
          "electron dist version = $(Get-Content 'node_modules/electron/dist/version' -ErrorAction SilentlyContinue)"

      # --publish never 是显式的：CI 下 electron-builder 会打印
      # "Implicit publishing triggered by CI detection" 并把策略设为
      # onTagOrDraft，本项目只上传自己的三件套，不需要它的发布链路。
      #
      # 输出同时落盘到 pack.log：失败时由下一步作为 artifact 上传，
      # 这样即使没有 Actions 日志权限也能读到 electron-builder 的真实报错。
      - name: 打包 unpacked 目录
        shell: pwsh
        run: |
          Write-Host '::group::electron-builder 输出'
          node scripts/build-installer.mjs --dir --publish never 2>&1 | Tee-Object -FilePath pack.log
          $code = $LASTEXITCODE
          Write-Host '::endgroup::'
          exit $code

      - name: 上传打包日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-log
          path: pack.log
          if-no-files-found: ignore
          retention-days: 7

      # 发布说明必须是「人写的文本」，不能退化成一行提交标题：
      #   1) 优先 release-notes/<tag>.md（这个文件就是 GitHub Release 的正文）
      #   2) 其次从仓库内 CHANGELOG.md 抽该版本段落
      #   3) 两者都没有时打 annotation 警告、用提交标题兜底；若标题本身只是
      #      「版本升到 x.y.z」这类无信息文本，或正文不足两行，直接失败。
      - name: 生成发布说明
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          $notes = $null
          $source = $null

          $candidate = "release-notes/$tag.md"
          if (Test-Path $candidate) {
            $notes = (Get-Content $candidate -Raw -Encoding utf8).Trim()
            $source = $candidate
          }

          if (-not $notes -and (Test-Path 'CHANGELOG.md')) {
            $lines = Get-Content 'CHANGELOG.md'
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^##\s' -and $lines[$i] -match [regex]::Escape($env:VERSION)) {
                $start = $i
                break
              }
            }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($j = $start + 1; $j -lt $lines.Count; $j++) {
                if ($lines[$j] -match '^##\s') { $end = $j; break }
              }
              if ($end -gt $start + 1) {
                $notes = (($lines[($start + 1)..($end - 1)]) -join "`n").Trim()
                $source = "CHANGELOG.md#$($env:VERSION)"
              }
            }
          }

          if (-not $notes) {
            $subject = (git log -1 --pretty=format:'%s')
            Write-Host "::warning::没有 release-notes/$tag.md，CHANGELOG.md 里也没有 $($env:VERSION) 段落，退回提交标题：$subject"
            if ($subject -match '^(版本升到|release:)\s*v?\d+\.\d+\.\d+$') {
              Write-Error "发布说明缺失：提交标题只有版本号。请补 release-notes/$tag.md 或 CHANGELOG.md 的 $($env:VERSION) 段落"
              exit 1
            }
            $notes = "（发布说明缺失，以下仅为提交标题；请补 CHANGELOG.md 或 release-notes/$tag.md）`n`n- $subject"
            $source = 'git log subject (fallback)'
          }

          $realLines = @($notes -split "`n" | Where-Object { $_.Trim() -ne '' })
          if ($realLines.Count -lt 2) {
            Write-Error "发布说明过短（不足两行），请补 release-notes/$tag.md 或 CHANGELOG.md 的 $($env:VERSION) 段落"
            exit 1
          }

          # release-notes/<tag>.md 常带一级标题（如 `# OPC Agent v1.0.4`），
          # 而下面还会加 `OPC Agent v<version>` 前缀，去掉重复的那一行。
          $noteLines = $notes -split "`n"
          if ($noteLines.Count -gt 1 -and $noteLines[0] -match '^#\s' -and $noteLines[0] -match [regex]::Escape($env:VERSION)) {
            $notes = (($noteLines[1..($noteLines.Count - 1)]) -join "`n").Trim()
          }

          Write-Host "发布说明来源：$source"
          $body = "OPC Agent v$($env:VERSION)`n`n" + $notes
          $body | Out-File -FilePath release-notes.md -Encoding utf8
          Write-Host '::group::发布说明'
          Get-Content release-notes.md
          Write-Host '::endgroup::'

      # 输出 release/update/{latest.json, app-<version>.asar, OPC-Agent-<version>-x64-full.zip}
      - name: 生成并签名更新清单
        shell: pwsh
        env:
          OPC_UPDATE_PRIVATE_KEY: ${{ secrets.OPC_UPDATE_PRIVATE_KEY }}
        run: |
          npm run update:build -- --version $env:VERSION `
            --notes-file release-notes.md `
            --channel "${{ github.event.inputs.channel || 'stable' }}" `
            --repo "${{ github.repository }}" `
            --out release/update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:VERSION"
          $assets = @(
            'release/update/latest.json',
            "release/update/app-$env:VERSION.asar",
            "release/update/OPC-Agent-$env:VERSION-x64-full.zip"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，覆盖上传资产"
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag --title "OPC Agent v$env:VERSION" --notes-file release-notes.md @assets
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
