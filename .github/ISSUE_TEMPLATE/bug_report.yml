name: 功能异常
description: 崩溃、报错、或行为与预期不符
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**安全漏洞请不要在这里提** —— 走 [私密报告通道](https://github.com/catex-lab/opc-agent/security/advisories/new)。

        描述清楚「怎么复现」比写长更好：能稳定复现的三步，胜过十段推测。

  - type: input
    id: version
    attributes:
      label: 版本号
      description: 应用内「设置 → 关于与隐私」可以看到，例如 `1.0.0`
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true

  - type: input
    id: install
    attributes:
      label: 安装方式
      description: 安装包 / 免安装版 / 从源码构建
      placeholder: 安装包（setup.exe）
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用开始，一步一步写
      placeholder: |
        1. 打开应用，进入通讯录
        2. 点 WorkBuddy 进入单聊
        3. 发送「你好」
        4. 观察到底部一直显示加载中
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错就把原文贴全，不要只写「报错了」
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: 涉及哪个 Agent
      description: 问题只出现在某个 Agent 上时选它，与具体 Agent 无关就选「不确定」
      multiple: true
      options:
        - 不确定 / 与 Agent 无关
        - WorkBuddy
        - Codex
        - Gemini
        - OpenCode
        - Claude Code
        - Cursor
        - Qoder
        - Qoder CN
        - 豆包
        - ZCode
        - Kimi
        - Pi
        - Antigravity CLI
        - Kimi Code CLI
        - 其他

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、日志片段、或你怀疑相关的线索。**贴之前请先抹掉对话内容与本机路径。**
    validations:
      required: false
